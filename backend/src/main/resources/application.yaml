spring:
  application:
    name: my-homepage-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:2h}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: strict

# Single site owner. Empty values disable owner login (the public site keeps working).
owner:
  username: ${OWNER_USERNAME:}
  password-hash: ${OWNER_PASSWORD_HASH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  paths-to-exclude: /api/auth/**,/api/portfolio/**

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  external:
    velog-graphql-url: ${APP_EXTERNAL_VELOG_GRAPHQL_URL:https://v2.velog.io/graphql}
    github-api-url: ${APP_EXTERNAL_GITHUB_API_URL:https://api.github.com}

monitoring:
  collection:
    enabled: ${MONITORING_COLLECTION_ENABLED:true}
    fixed-delay: ${MONITORING_COLLECTION_FIXED_DELAY:10m}
    initial-delay: ${MONITORING_COLLECTION_INITIAL_DELAY:1s}
    request-timeout: ${MONITORING_COLLECTION_REQUEST_TIMEOUT:3s}
  retention:
    period: ${MONITORING_RETENTION_PERIOD:30d}

# Owner portfolio market data. Empty keys = not connected yet: collectors skip, manual input works.
# Schedules (KST) can be overridden with portfolio.schedule.{kr-prices,us-prices,fx,snapshot}.
portfolio:
  request-timeout: ${PORTFOLIO_REQUEST_TIMEOUT:5s}
  kis:
    base-url: ${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
  kexim:
    base-url: ${KEXIM_BASE_URL:https://oapi.koreaexim.go.kr}
    api-key: ${KEXIM_API_KEY:}
