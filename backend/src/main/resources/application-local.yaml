spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      file: ${SPRING_DOCKER_COMPOSE_FILE:./docker-compose.yaml}
      lifecycle-management: start-and-stop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/my_homepage}
    username: ${DB_USERNAME:my_homepage}
    password: ${DB_PASSWORD:my_homepage}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:true}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.myhome.backend: ${APP_LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
    org.springframework.boot.docker.compose: ${DOCKER_COMPOSE_LOG_LEVEL:INFO}
