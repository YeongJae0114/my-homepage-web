spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
    show-sql: ${JPA_SHOW_SQL:false}

logging:
  level:
    com.myhome.backend: ${APP_LOG_LEVEL:INFO}
