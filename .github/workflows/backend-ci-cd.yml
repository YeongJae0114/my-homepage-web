name: Backend CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "backend-v*"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/my-homepage-backend

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Build boot jar
        run: ./gradlew bootJar --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload boot jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-boot-jar
          path: backend/build/libs/*.jar
          if-no-files-found: error

  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=sha-${{ github.sha }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USER }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          port: ${{ secrets.BACKEND_PORT || 22 }}
          source: "backend/compose.prod.yml"
          target: "${{ secrets.BACKEND_DEPLOY_PATH }}"
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ steps.image.outputs.name }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          APP_FRONTEND_BASE_URL: ${{ secrets.APP_FRONTEND_BASE_URL }}
          MONITORING_COLLECTION_ENABLED: ${{ secrets.MONITORING_COLLECTION_ENABLED }}
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.BACKEND_USER }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          port: ${{ secrets.BACKEND_PORT || 22 }}
          envs: BACKEND_IMAGE,GHCR_USERNAME,GHCR_TOKEN,BACKEND_DEPLOY_PATH,DB_URL,DB_USERNAME,DB_PASSWORD,APP_CORS_ALLOWED_ORIGINS,APP_FRONTEND_BASE_URL,MONITORING_COLLECTION_ENABLED
          script: |
            set -e
            cd "$BACKEND_DEPLOY_PATH"
            install -m 600 /dev/null .env.production
            {
              printf 'DB_URL=%s\n' "$DB_URL"
              printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
              printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
              printf 'APP_CORS_ALLOWED_ORIGINS=%s\n' "$APP_CORS_ALLOWED_ORIGINS"
              printf 'APP_FRONTEND_BASE_URL=%s\n' "$APP_FRONTEND_BASE_URL"
              printf 'MONITORING_COLLECTION_ENABLED=%s\n' "${MONITORING_COLLECTION_ENABLED:-false}"
            } > .env.production
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            BACKEND_IMAGE="$BACKEND_IMAGE" docker compose -f compose.prod.yml pull backend
            BACKEND_IMAGE="$BACKEND_IMAGE" docker compose -f compose.prod.yml up -d backend
            docker image prune -f
